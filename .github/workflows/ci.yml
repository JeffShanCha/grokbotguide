name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 「最近更新」日期需要完整的 git 历史
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check content
        run: npm run check:content
      - name: Test collection deduplication
        run: npm run test:collection
      - name: Typecheck worker
        run: npm run check:worker
      - name: Test search highlighting
        run: npm run test:search
      - name: Build
        run: npm run build
      - name: Check tutorial search index
        run: npm run check:search
      - name: Check English navigation and content
        run: npm run check:english
