name: Weekly link check

on:
  schedule:
    - cron: '0 1 * * 1' # 每周一 09:00（北京时间）
  workflow_dispatch:

permissions:
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 2 --timeout 20
            --exclude 'x\.com' --exclude 'twitter\.com' --exclude 'zsxq\.com'
            'src/content/**/*.md' 'src/content/**/*.mdx' 'src/data/*.yaml'
          fail: false
      - name: Open an issue for broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: '死链检查 / Broken links report'
          content-filepath: ./lychee/out.md
          labels: broken-links
